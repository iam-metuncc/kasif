<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sameh Classes</title>

    <style>
        .class_image {
        display: block;
        margin-left: auto;
        margin-right: auto;
        margin-top: 20px;
        margin-bottom: 20px;
        }

        p{
            display: block;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 10px;
            color:rgb(0, 0, 0);
            font-size:xx-large;
            font-weight: bold;
            font-family: 'Times New Roman';

        }
        .red_text{
            color: rgb(221, 27, 27);
        }
    </style>
</head>

<body style="background-color: darkgrey">
        <p>
            There are 9 table types under <span class="red_text">"My Types"</span>, choose the one that matches the table image you have<br>
            If the image you have <span class="red_text"> is not a table</span>, choose <span class="red_text"> "Not a table" </span> type <br>
            If the image you have <span class="red_text"> is a table, but its type is not one of the 9 types  </span>, then choose <span class="red_text"> "Others" </span> type
        </p>
        <img src="tables_types.png" alt="Sameh Classes" class="class_image"></img>
    
</body>

</html>
